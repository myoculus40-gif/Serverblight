let AC,M,RV,drone=[];

[55,58,82.4].forEach(f=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=160;g.gain.value=.01;o.connect(fl);fl.connect(g);g.connect(M);o.start();drone.push(g)})}catch(e){}}
function tone(f,d,ty,v,sl,rev){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(M);if(rev)g.connect(RV);o.start(t);o.stop(t+d+.05)}

const armG=new THREE.CylinderGeometry(.04,.04,1,6),armM=new THREE.MeshLambertMaterial({color:0x2a2a2a});

const hands=[0,1].map(i=>{const c=renderer.xr.getController(i);rig.add(c);c.add(new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),new THREE.MeshLambertMaterial({color:0x2a2a2a})));const a=new THREE.Mesh(armG,armM);rig.add(a);return{c,a,prev:new V3(),has:false,touch:false}});
const vel=new V3(),mv=new V3(),HP=new V3();let lastSafe=new V3(0,.3,30),safeT=0;

function boxPush(p,r,out){let hit=false;out.set(0,0,0);for(const b of boxes){if(p.x<b.min.x-r||p.x>b.max.x+r||p.y<b.min.y-r||p.y>b.max.y+r||p.z<b.min.z-r||p.z>b.max.z+r)continue;
const dx=p.x-Math.max(b.min.x,Math.min(p.x,b.max.x)),dy=p.y-Math.max(b.min.y,Math.min(p.y,b.max.y)),dz=p.z-Math.max(b.min.z,Math.min(p.z,b.max.z)),d2=dx*dx+dy*dy+dz*dz;if(d2>=r*r)continue;hit=true;
let x,y,z;if(d2>1e-8){const d=Math.sqrt(d2),k=(r-d)/d;x=dx*k;y=dy*k;z=dz*k}else{x=0;z=0;y=b.max.y-p.y+r}
if(Math.abs(x)>Math.abs(out.x))out.x=x;if(Math.abs(y)>Math.abs(out.y))out.y=y;if(Math.abs(z)>Math.abs(out.z))out.z=z}return hit}
function playerStep(dt){let n=0;mv.set(0,0,0);
hands.forEach(h=>{const lp=h.c.position;_s.copy(rig.position).add(lp);const hit=boxPush(_s,.13,_o);
if(hit){n++;if(h.has)mv.add(_p.copy(h.prev).sub(lp));if(!h.touch)thump(Math.min(.5,vel.length()*.04+.15))}
h.touch=hit;h.prev.copy(lp);h.has=true});

safeT-=dt;if(safeT<=0&&rig.position.y>-12){safeT=1;lastSafe.copy(rig.position)}}

if(boxPush(_s,.3,_o)){rig.position.add(_o);if(_o.y>0&&vel.y<0)vel.y=0;if(_o.y<0&&vel.y>0)vel.y=0;if(Math.abs(_o.x)>.001)vel.x*=.3;if(Math.abs(_o.z)>.001)vel.z*=.3}

const dx=tx-P.x,dz=tz-P.z,d=Math.hypot(dx,dz)||1;P.x+=dx/d*sp*dt;P.z+=dz/d*sp*dt;m.g.rotation.y=Math.atan2(dx,dz);
const fy=phase>=3?0:Math.max(-10,Math.min(0,rig.position.y+.7));P.y+=(fy-P.y)*Math.min(1,dt*4)}
m.body.position.y=.8+Math.abs(Math.sin(t*9))*.12;m.head.rotation.z=Math.sin(t*11)*.25;pose(m,2,t);
if(m.mode!=='emerge'&&Math.hypot(HP.x-P.x,HP.z-P.z)<.9&&Math.abs(HP.y-1-P.y)<1.8)caught()}
